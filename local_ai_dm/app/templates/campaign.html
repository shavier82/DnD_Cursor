<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campaign · AI DM</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body data-campaign-id="{{ campaign_id }}" data-debug="{{ 'true' if dm_debug_panel else 'false' }}">
  <header class="topbar">
    <a href="/">← Campaigns</a>
    <h1 id="campaign-name">Campaign</h1>
    <span id="ollama-badge" class="badge">Ollama…</span>
  </header>

  <div class="layout">
    <aside class="sidebar left">
      <h2>Party</h2>
      <div id="party-list"></div>
      <details open>
        <summary>Add character</summary>
        <form id="add-character">
          <input name="name" required placeholder="Character name" />
          <input name="player_name" placeholder="Player name" />
          <input name="character_class" placeholder="Class" />
          <input name="race" placeholder="Race" />
          <input name="max_hp" type="number" value="20" min="1" />
          <input name="armor_class" type="number" value="14" min="1" />
          <button type="submit">Add</button>
        </form>
      </details>
    </aside>

    <section class="chat-panel">
      <div id="chat-log" class="chat-log"></div>
      <form id="chat-form" class="chat-form">
        <textarea name="message" rows="3" required placeholder="What do you do?"></textarea>
        <div class="chat-actions">
          <button type="submit">Send</button>
          <button type="button" id="roll-dice-btn">Roll dice</button>
        </div>
      </form>
      <div id="dice-result" class="dice-result muted"></div>
      <div id="roll-request" class="roll-request"></div>
    </section>

    <aside class="sidebar right">
      <h2>Location</h2>
      <p id="location">—</p>
      <h2>Quests</h2>
      <ul id="quest-list"><li class="muted">None yet</li></ul>
      <h2>Combat</h2>
      <p id="combat-status">Not in combat</p>
      <ul id="initiative-list"></ul>

      {% if dm_debug_panel %}
      <details class="debug-panel" open>
        <summary>DM Debug</summary>
        <p id="rag-status" class="muted">RAG: checking…</p>
        <button type="button" id="ingest-btn">Ingest sourcebooks</button>
        <pre id="debug-output">Retrieved rule chunks appear here after chat.</pre>
      </details>
      {% endif %}
    </aside>
  </div>

  <script src="/static/js/campaign.js"></script>
</body>
</html>
